<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader - No Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #16213e;
            border-radius: 16px;
            padding: 40px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        h1 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 25px;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 14px;
            border: 2px solid #2a3a5e;
            border-radius: 10px;
            background: #0f3460;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea::placeholder {
            color: #6a8ab0;
        }

        textarea:focus {
            outline: none;
            border-color: #e94560;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 6px;
        }

        #urlInput {
            flex-grow: 1;
            background: #0f3460;
            border: 2px solid #2a3a5e;
            border-radius: 10px;
            padding: 0 14px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
        }
        #urlInput:focus {
            outline: none;
            border-color: #e94560;
        }

        #addBtn {
            flex-shrink: 0;
            width: auto;
            padding: 0 25px;
        }

        .hint {
            color: #6a8ab0;
            font-size: 12px;
            margin-top: 8px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
            background: #e94560;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #2a3a5e;
            margin-top: 8px;
        }

        .btn-secondary:hover {
            background: #3a4a6e;
            box-shadow: none;
        }

        .result {
            margin-top: 20px;
        }

        .video-card {
            background: #0f3460;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .video-card img {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .video-info {
            flex: 1;
            min-width: 0;
        }

        .video-info .title {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .video-info .author {
            color: #aaa;
            font-size: 13px;
        }

        .video-info .stats {
            color: #6a8ab0;
            font-size: 12px;
            margin-top: 4px;
        }

        .download-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 13px;
            white-space: nowrap;
        }

        .download-btn:hover {
            background: #ff6b81;
        }

        .loading {
            color: #aaa;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #2a3a5e;
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error {
            color: #ff6b6b;
            background: #1a2a4e;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 14px;
        }

        .url-count {
            color: #6a8ab0;
            font-size: 12px;
            margin-top: 6px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            .video-card {
                flex-direction: column;
                text-align: center;
            }
            .video-card img {
                width: 100%;
                height: auto;
                max-height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 TikTok Downloader</h1>
        <p class="subtitle">Paste video URLs - works in browser, no server needed!</p>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Paste a single TikTok URL here...">
            <button id="addBtn" class="btn">Add Video</button>
        </div>
        <div class="hint">💡 Add videos one by one to create your download list.</div>

        <button class="btn btn-secondary" onclick="clearAll()">🗑️ Clear All</button>

        <div id="resultContainer" class="result"></div>
    </div>

    <script>
        const videoStore = [];

        document.addEventListener('DOMContentLoaded', () => {
            const addBtn = document.getElementById('addBtn');
            const urlInput = document.getElementById('urlInput');

            addBtn.addEventListener('click', addVideo);
            urlInput.addEventListener('keyup', (event) => {
                if (event.key === 'Enter') {
                    addVideo();
                }
            });
        });

        async function addVideo() {
            const urlInput = document.getElementById('urlInput');
            const url = urlInput.value.trim();

            const tiktokRegex = /https?:\/\/(?:[a-zA-Z0-9-]+\.)?tiktok\.com\/./i;
            if (!url || !tiktokRegex.test(url)) {
                alert('Please paste a valid TikTok video URL (e.g., tiktok.com/@user/video/... or vt.tiktok.com/...)');
                return;
            }

            const addBtn = document.getElementById('addBtn');
            addBtn.disabled = true;
            addBtn.innerHTML = '<div class="spinner" style="width: 16px; height: 16px; border-width: 2px; margin: 0 auto;"></div>';

            try {
                const videoInfo = await getVideoInfo(url);
                if (videoInfo) {
                    videoStore.push(videoInfo);
                    displayVideoCard(videoInfo);
                    urlInput.value = ''; // Clear input on success
                } else {
                    alert('Could not fetch video information. Please check the URL.');
                }
            } catch (error) {
                alert(`An error occurred: ${error.message}`);
            } finally {
                addBtn.disabled = false;
                addBtn.textContent = 'Add Video';
                urlInput.focus();
            }
        }

        // TikTok video info API (using tikwm to avoid CORS issues)
        async function getVideoInfo(url) {
            try {
                const apiUrl = `https://tikwm.com/api/?url=${encodeURIComponent(url)}`;
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Failed to fetch video info');
                
                const data = await response.json();
                if (data.code !== 0 || !data.data) {
                    throw new Error(data.msg || 'Could not find video details');
                }
                
                return {
                    id: data.data.id || 'Unknown',
                    title: data.data.title || 'TikTok Video',
                    author: (data.data.author && (data.data.author.nickname || data.data.author.unique_id)) || 'Unknown',
                    thumbnail: data.data.cover || '',
                    url: url
                };
            } catch (error) {
                console.error('Error fetching video:', error);
                return null;
            }
        }

        function displayVideoCard(video) {
            const container = document.getElementById('resultContainer');
            const cardIndex = videoStore.length - 1;

            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                ${video.thumbnail ? `<img src="${video.thumbnail}" alt="Thumbnail" onerror="this.style.display='none'">` : ''}
                <div class="video-info">
                    <div class="title">${escapeHtml(video.title)}</div>
                    <div class="author">@${escapeHtml(video.author)}</div>
                    <div class="stats">Video ID: ${video.id}</div>
                </div>
                <button class="download-btn">⬇️ Download</button>
            `;
            
            card.querySelector('.download-btn').addEventListener('click', () => downloadVideo(video.url, card.querySelector('.download-btn')));

            container.appendChild(card);
        }

        async function downloadVideo(url, button) {
            const originalText = button.innerHTML;
            try {
                button.disabled = true;
                button.innerHTML = '<div class="spinner" style="width:16px; height:16px; border-width:2px; margin: 0 auto;"></div>';

                const apiUrl = `https://tikwm.com/api/?url=${encodeURIComponent(url)}`;
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error(`API request failed with status ${response.status}`);
                
                const data = await response.json();
                if (data.code !== 0 || !data.data || !data.data.play) {
                    throw new Error(data.msg || 'Could not find video stream.');
                }

                const videoUrl = data.data.hdplay || data.data.play;
                const videoResponse = await fetch(videoUrl);
                if (!videoResponse.ok) throw new Error('Failed to fetch the video file.');
                
                const videoBlob = await videoResponse.blob();
                const blobUrl = URL.createObjectURL(videoBlob);

                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = `${data.data.id || 'tiktok_video'}.mp4`; 
                
                document.body.appendChild(a);
                a.click();
                
                URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);

            } catch (error) {
                console.error('Download error:', error);
                alert(`Failed to download video: ${error.message}`);
            } finally {
                button.disabled = false;
                button.innerHTML = originalText;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearAll() {
            videoStore.length = 0; // Empty the array
            document.getElementById('resultContainer').innerHTML = '';
            document.getElementById('urlInput').focus();
        }
    </script>
</body>
</html>
